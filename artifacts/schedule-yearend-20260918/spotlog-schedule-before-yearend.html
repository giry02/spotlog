let index=0,all=matchMedia('(max-width:720px)').matches;
function resize(){const availableWidth=stage.clientWidth-40,availableHeight=stage.clientHeight-40;document.documentElement.style.setProperty('--scale',Math.max(.1,Math.min(1,availableWidth/1280,availableHeight/720)));}
function show(next,{focus=false,scroll=true}={}){index=Math.max(0,Math.min(pages.length-1,Number.isFinite(next)?next:0));pages.forEach((p,i)=>{p.classList.toggle('active',i===index);p.setAttribute('aria-hidden',String(!all&&i!==index));});document.querySelector('.counter').textContent=`${String(index+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}`;select.value=String(index);document.querySelector('[data-prev]').disabled=index===0;document.querySelector('[data-next]').disabled=index===pages.length-1;history.replaceState(null,'','#slide-'+(index+1));if(all&&scroll)pages[index].scrollIntoView({block:'start'});else if(!all)stage.scrollTop=0;if(focus)pages[index].focus({preventScroll:true});resize();}
function setAll(value){all=value;document.body.classList.toggle('all-view',all);allButton.setAttribute('aria-pressed',String(all));allButton.textContent=all?'발표 보기':'전체 보기';show(index,{scroll:false});}
document.querySelector('[data-prev]').onclick=()=>show(index-1,{focus:true});document.querySelector('[data-next]').onclick=()=>show(index+1,{focus:true});select.onchange=()=>show(Number(select.value),{focus:true});allButton.onclick=()=>setAll(!all);document.querySelector('[data-print]').onclick=()=>window.print();document.querySelector('[data-fullscreen]').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.querySelector('.key-hint').textContent='브라우저의 전체 화면 기능을 사용해 주세요.';}};
addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('select,input,textarea,button'))return;const actions={ArrowRight:index+1,PageDown:index+1,ArrowLeft:index-1,PageUp:index-1,Home:0,End:pages.length-1};if(e.key in actions){e.preventDefault();show(actions[e.key],{focus:true});}});addEventListener('hashchange',()=>show(Number(location.hash.replace('#slide-',''))-1));
addEventListener('beforeprint',()=>pages.forEach(p=>p.setAttribute('aria-hidden','false')));addEventListener('afterprint',()=>pages.forEach((p,i)=>p.setAttribute('aria-hidden',String(!all&&i!==index))));
index=/^#slide-\d+$/.test(location.hash)?Math.max(0,Math.min(pages.length-1,Number(location.hash.slice(7))-1)):0;setAll(all);if(all&&index>0)show(index);document.documentElement.dataset.ready='true';
