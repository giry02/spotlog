<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제로 방향성 · 모바일 배치 비교</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e9e9e5;color:#171716;font:14px/1.6 system-ui}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}label{display:flex;align-items:center;gap:8px}select,button{min-height:44px;padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:10px;font:inherit}main{display:flex;align-items:flex-start;gap:16px;width:max-content}h2{font-size:14px;margin:0 0 8px}iframe{box-sizing:content-box;border:1px solid #ccc;background:#f8f8f6;display:block}pre{white-space:pre-wrap;max-height:360px;overflow:auto;max-width:1240px;background:#fff;padding:16px}p{max-width:1100px}</style>
<nav><label>비교 대상<select id="version"><option value="current">현재 앱</option><option value="new">제로 시안</option></select></label><label>화면<select id="screen"></select></label><label>사용자<select id="persona"><option value="new">처음 사용</option><option value="member">모임원</option><option value="host">모임장</option></select></label><button id="load">화면 열기</button><button id="measure">배치 측정</button></nav>
<p>화면 전체 가로 넘침·글자 역할·조작 높이·이미지 확인용. 기존 앱은 읽기 전용, 새 시안은 페이지 메모리. 고객·운영자 자료 변경 없음.</p>
<main><section><h2>320px</h2><iframe title="320px 화면" width="320" height="844"></iframe></section><section><h2>390px</h2><iframe title="390px 화면" width="390" height="844"></iframe></section><section><h2>460px</h2><iframe title="460px 화면" width="460" height="844"></iframe></section></main><pre id="result">화면을 연 뒤 배치 측정.</pre>
<script>
const oldScreens=[['home','홈 · 장소'],['home-groups','홈 · 모임'],['places-guide','둘러보기'],['together','함께하기'],['together-find','모임 찾기'],['saved','관심 장소'],['trips','내 여행'],['profile','계정']];
const newScreens=[['home','홈'],['discover','발견'],['groups','내 모임'],['space','내 공간'],['group','모임 홈'],['proposal','함께 정하기'],['activity','약속'],['chat','모임 전체 대화'],['summary','대화 정리'],['applications','가입 신청'],['join','모임 소개·가입']];
const ver=document.querySelector('#version'),screen=document.querySelector('#screen'),persona=document.querySelector('#persona');
function options(){screen.replaceChildren(...(ver.value==='current'?oldScreens:newScreens).map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o;}));}
function load(){const src=ver.value==='current'?'/#'+screen.value:'/tests/zero-direction-review.html?embed=1&screen='+screen.value+'&persona='+persona.value;for(const frame of document.querySelectorAll('iframe'))frame.src=src;document.querySelector('#result').textContent='불러온 뒤 배치 측정.';}
ver.onchange=options;document.querySelector('#load').onclick=load;options();load();
document.querySelector('#measure').onclick=()=>{const rows=[...document.querySelectorAll('iframe')].map(frame=>{const d=frame.contentDocument,w=frame.contentWindow;const visible=el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&w.getComputedStyle(el).visibility!=='hidden'&&!el.closest('[hidden]');};const controls=[...d.querySelectorAll('button,input,select,textarea,summary')].filter(visible);return {version:ver.value,screen:screen.value,persona:persona.value,requestedWidth:Number(frame.width),actualWidth:d.documentElement.clientWidth,pageOverflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,heading:[...d.querySelectorAll('h1')].filter(visible).map(el=>el.textContent),controlCount:controls.length,smallControls:controls.filter(el=>(el.matches('[type=checkbox],[type=radio]')?(el.closest('label')||el):el).getBoundingClientRect().height<43.5).map(el=>({label:(el.getAttribute('aria-label')||el.textContent).trim().slice(0,50),height:Math.round(el.getBoundingClientRect().height)})),inputFonts:controls.filter(el=>/INPUT|SELECT|TEXTAREA/.test(el.tagName)&&!el.matches('[type=checkbox],[type=radio]')).map(el=>({type:el.tagName,font:w.getComputedStyle(el).fontSize})),brokenImages:[...d.images].filter(el=>visible(el)&&el.complete&&el.currentSrc&&!el.naturalWidth).length,pendingImages:[...d.images].filter(el=>visible(el)&&el.currentSrc&&!el.complete).length};});document.querySelector('#result').textContent=JSON.stringify(rows,null,2);};
</script></html>
