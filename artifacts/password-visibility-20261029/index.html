<!doctype html><html lang="ko"><meta charset="utf-8"><title>비밀번호 보기 폭별 확인</title><style>body{margin:0;padding:10px;background:#ddd;font:14px system-ui}nav{margin-bottom:10px}button{min-height:44px;padding:10px}main{display:flex;gap:12px}section{flex:none}h2{font-size:14px;margin:0 0 8px}iframe{display:block;border:1px solid #aaa;background:#fff}pre{white-space:pre-wrap}</style><nav><button id="measure">비밀번호 입력 배치 측정</button></nav><main><section><h2>320px</h2><iframe title="320px 비밀번호 입력" width="320" height="750" src="/tests/password-field-review.html"></iframe></section><section><h2>390px</h2><iframe title="390px 비밀번호 입력" width="390" height="750" src="/tests/password-field-review.html"></iframe></section><section><h2>460px</h2><iframe title="460px 비밀번호 입력" width="460" height="750" src="/tests/password-field-review.html"></iframe></section></main><pre id="result" aria-live="polite"></pre><script>document.querySelector('#measure').addEventListener('click',()=>document.querySelector('#result').textContent=JSON.stringify([...document.querySelectorAll('iframe')].map(frame=>{const doc=frame.contentDocument,win=frame.contentWindow;return{width:frame.width,overflow:doc.documentElement.scrollWidth-doc.documentElement.clientWidth,inputs:[...doc.querySelectorAll('.account-password-field')].map(field=>{const input=field.querySelector('input'),button=field.querySelector('button'),r=button.getBoundingClientRect(),ir=input.getBoundingClientRect();return{label:field.querySelector('label').textContent,type:input.type,autocomplete:input.autocomplete,font:win.getComputedStyle(input).fontSize,disabled:input.disabled,pressed:button.getAttribute('aria-pressed'),toggle:{width:Math.round(r.width),height:Math.round(r.height)},inputHeight:Math.round(ir.height),inputLabelConnected:input.labels.length===1,hintConnected:!!input.getAttribute('aria-describedby')?!!doc.getElementById(input.getAttribute('aria-describedby')):true}}),status:doc.querySelector('#password-review-status').textContent}}),null,2));</script></html>
