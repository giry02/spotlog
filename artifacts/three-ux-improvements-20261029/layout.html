<!doctype html><html lang="ko"><meta charset="utf-8"><title>세 가지 편의 기능 너비 검수</title><style>body{margin:0;padding:12px;background:#e8e8e4;font:14px/1.6 system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,button{min-height:44px;font:inherit;padding:8px 12px;background:white;border:1px solid #ccc;border-radius:8px}main{display:flex;gap:16px;width:max-content}h2{font-size:14px;margin:0 0 8px}iframe{display:block;border:1px solid #ccc;background:#fff}pre{white-space:pre-wrap}</style><nav><label>검수 화면 <select id="review"><option value="/tests/saved-search-review.html">관심 장소 검색</option><option value="/tests/group-public-meetup-return-review.html">선택 정모 가입·복귀</option><option value="/tests/password-field-review.html">비밀번호 보기·숨기기</option></select></label><button id="open">화면 열기</button><button id="measure">배치 측정</button></nav><main><section><h2>320px</h2><iframe title="320px 확인 화면" width="320" height="800" src="/tests/saved-search-review.html"></iframe></section><section><h2>390px</h2><iframe title="390px 확인 화면" width="390" height="800" src="/tests/saved-search-review.html"></iframe></section><section><h2>460px</h2><iframe title="460px 확인 화면" width="460" height="800" src="/tests/saved-search-review.html"></iframe></section></main><pre id="result"></pre><script>
document.querySelector('#open').onclick=()=>{for(const frame of document.querySelectorAll('iframe'))frame.src=document.querySelector('#review').value;document.querySelector('#result').textContent='화면 로드 후 배치 측정';};
document.querySelector('#measure').onclick=()=>{document.querySelector('#result').textContent=JSON.stringify([...document.querySelectorAll('iframe')].map(frame=>{const doc=frame.contentDocument,win=frame.contentWindow;return{width:Number(frame.width),url:doc.URL,pageOverflow:doc.documentElement.scrollWidth-doc.documentElement.clientWidth,buttons:[...doc.querySelectorAll('.interest-search-toggle,.interest-search-clear,.account-password-toggle,.gd-event,.tg-primary')].filter(el=>el.getBoundingClientRect().width&&el.getBoundingClientRect().height).map(el=>({label:el.getAttribute('aria-label')||el.textContent.trim().slice(0,40),width:Math.round(el.getBoundingClientRect().width),height:Math.round(el.getBoundingClientRect().height),font:win.getComputedStyle(el).fontSize})),inputs:[...doc.querySelectorAll('.interest-search-field input,.account-password-control input')].filter(el=>el.getBoundingClientRect().width).map(el=>({label:el.getAttribute('aria-label')||doc.querySelector('label[for="'+CSS.escape(el.id)+'"]')?.textContent,type:el.type,font:win.getComputedStyle(el).fontSize,height:Math.round(el.getBoundingClientRect().height)}))}}),null,2)};
</script></html>
