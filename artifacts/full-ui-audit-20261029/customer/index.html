<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스팟로그 전체 화면 검수</title>
<style>body{margin:0;padding:12px;background:#e8e8e4;font:14px/1.5 system-ui;color:#252521}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}select,button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #c8c8c1;border-radius:8px;background:#fff}main{display:flex;gap:16px;width:max-content}h2{font-size:14px;margin:0 0 8px}iframe{display:block;border:1px solid #ccc;background:#fafaf8}pre{white-space:pre-wrap;max-width:1200px}p{margin:0 0 12px}</style>
<nav><label>화면 <select id="route"><option value="/#home">홈 장소</option><option value="/#home-groups">홈 모임</option><option value="/#home-trips">홈 여행</option><option value="/#places-guide">둘러보기 장소</option><option value="/#places-photo">둘러보기 사진</option><option value="/#places-video">둘러보기 영상</option><option value="/#community">여행기 목록</option><option value="/#trips">내 여행</option><option value="/#saved">관심 장소</option><option value="/#profile">비로그인 프로필</option><option value="/#together-find">모임 찾기</option><option value="/tests/moa-chat-review.html">모임·활동·채팅 메모리 검수</option><option value="/tests/moa-chat-review.html?view=summary">대화 정리</option><option value="/tests/plan-view-edit.html?mode=ready">개인 여행 보기</option><option value="/tests/plan-view-edit.html?mode=draft">개인 여행 작성</option><option value="/tests/trip-candidate-review.html">음식점·숙소 후보 확인</option><option value="/#errors">오류 화면</option></select></label><button id="open">화면 열기</button><button id="measure">배치 측정</button></nav>
<p>기존 저장자료 초기화 없이 읽기 검수. 모임 채팅은 페이지 메모리 전용. 개인 여행·후보는 전용 검수 저장키 사용.</p>
<main><section><h2>320px</h2><iframe title="320px 고객 화면" width="320" height="740" src="/#home"></iframe></section><section><h2>390px</h2><iframe title="390px 고객 화면" width="390" height="740" src="/#home"></iframe></section><section><h2>460px</h2><iframe title="460px 고객 화면" width="460" height="740" src="/#home"></iframe></section></main><pre id="results"></pre>
<script>
for(const [name,url] of [['여행기 상세','/#journey-southern-road-five-days'],['음식점 목록','/#places-guide-food'],['숙소 목록','/#places-guide-stay'],['여행 중 진행','/tests/plan-view-edit.html?mode=traveling'],['음식점·레저 작성','/tests/layout-audit.html?view=plan'],['여행 생성 입력','/tests/layout-audit.html']])document.querySelector('#route').add(new Option(name,url));
document.querySelector('#open').addEventListener('click',()=>{document.querySelectorAll('iframe').forEach(frame=>frame.src=document.querySelector('#route').value);document.querySelector('#results').textContent='화면을 불러온 뒤 배치 측정';});
document.querySelector('#measure').addEventListener('click',()=>{const result=[...document.querySelectorAll('iframe')].map(frame=>{const d=frame.contentDocument,w=frame.contentWindow,v=Number(frame.width);const visible=e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&!e.closest('[hidden]')};return{width:v,url:d.URL,heading:[...d.querySelectorAll('h1,h2')].filter(visible).slice(0,3).map(e=>e.textContent),pageOverflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,dialogs:d.querySelectorAll('[role=dialog]').length,brokenImages:[...d.images].filter(e=>visible(e)&&e.complete&&e.naturalWidth===0).map(e=>e.getAttribute('src')),shortControls:[...d.querySelectorAll('button,summary,input:not([type=checkbox]):not([type=radio]),select,textarea')].filter(visible).map(e=>({name:e.getAttribute('aria-label')||e.textContent.trim().slice(0,45),height:Math.round(e.getBoundingClientRect().height),font:w.getComputedStyle(e).fontSize})).filter(e=>e.height<44),edgeOverflow:[...d.querySelectorAll('.page,.app-header,.tabbar,.tg,.tg-card,.tg-composer,.gd,.gd-group-card,.bottom-sheet,.sheet,.plan-day,.plan-stop,.interest-kind-filter')].filter(visible).filter(e=>{const r=e.getBoundingClientRect();return r.left< -1||r.right>v+1}).map(e=>e.className)}});document.querySelector('#results').textContent=JSON.stringify(result,null,2);});
</script></html>
