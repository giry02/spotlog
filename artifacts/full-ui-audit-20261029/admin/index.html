<!doctype html><html lang="ko"><meta charset="utf-8"><title>관리자 전체 레이아웃 검수</title><style>body{margin:0;padding:8px;background:#d8dad8;font:14px system-ui}nav{display:flex;gap:8px;margin-bottom:8px}button{min-height:44px;padding:10px 14px}iframe{display:block;border:1px solid #aaa;background:#fff;height:790px}pre{white-space:pre-wrap;font:12px monospace}</style><nav aria-label="검수 화면 폭"><button data-width="1440">1440px 데스크톱</button><button data-width="768">768px 태블릿</button><button data-width="390">390px 모바일</button><button id="measure">현재 배치 측정</button></nav><iframe title="관리자 미리보기 검수" style="width:1440px" src="/admin-preview.html"></iframe><pre id="result" aria-live="polite"></pre><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>frame.style.width=button.dataset.width+'px'));
document.querySelector('#measure').addEventListener('click',()=>{const doc=frame.contentDocument,win=frame.contentWindow;const visible=el=>el.getClientRects().length&&!el.closest('[hidden]')&&win.getComputedStyle(el).visibility!=='hidden';const main=doc.querySelector('.admin-main');const box=el=>{const r=el.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};document.querySelector('#result').textContent=JSON.stringify({width:frame.clientWidth,page:doc.querySelector('h1')?.textContent,docOverflow:doc.documentElement.scrollWidth-doc.documentElement.clientWidth,mainOverflow:main?main.scrollWidth-main.clientWidth:null,mainScrollTop:main?Math.round(main.scrollTop):null,placeDetailTop:(()=>{const detail=doc.querySelector('.admin-places-page .admin-split > .admin-panel:nth-child(2)');return detail&&main?Math.round(detail.getBoundingClientRect().top-main.getBoundingClientRect().top):null})(),tables:[...doc.querySelectorAll('.admin-table-wrap')].filter(visible).map(el=>({client:el.clientWidth,scroll:el.scrollWidth,headers:[...el.querySelectorAll('th')].map(h=>({text:h.textContent.trim(),...box(h)}))})),tabs:[...doc.querySelectorAll('.admin-tabs')].filter(visible).map(el=>({gap:win.getComputedStyle(el).gap,...box(el)})),shortTouchButtons:[...doc.querySelectorAll('.admin-app button,.admin-select-options button')].filter(visible).map(el=>({text:el.getAttribute('aria-label')||el.textContent.trim(),...box(el)})).filter(el=>el.w<44||el.h<44),smallButtons:[...doc.querySelectorAll('.admin-app button')].filter(visible).map(el=>({text:el.getAttribute('aria-label')||el.textContent.trim(),...box(el)})).filter(el=>el.w<36||el.h<36),horizontalOverflowElements:[...doc.querySelectorAll('.admin-main *')].filter(visible).filter(el=>{const r=el.getBoundingClientRect();const parent=el.closest('.admin-table-wrap,pre,.admin-select-popup,.admin-tabs');return !parent&&r.right>doc.documentElement.clientWidth+1}).slice(0,20).map(el=>({tag:el.tagName,cls:el.className,text:el.textContent.trim().slice(0,65),...box(el)}))},null,2)});
</script></html>
