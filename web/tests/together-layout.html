<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>함께하기 화면 검수</title><style>
body{margin:0;padding:24px;background:#e9e9e7;font:16px/1.6 system-ui;color:#171716}header{max-width:1000px}h1{font-size:24px}label,button,select{font:inherit}select,button{padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}main{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-top:24px}.frame{background:#fff;padding:12px;border-radius:14px}.frame h2{font-size:18px;margin:0 0 10px}iframe{display:block;height:844px;border:0;border-radius:10px}#results{max-height:280px;overflow:auto;white-space:pre-wrap;background:#fff;padding:16px;border-radius:12px;max-width:1000px}p{max-width:1000px}
</style></head><body><header><h1>함께하기 · 모바일 화면 검수</h1><p>320·390·460px에서 같은 실제 로컬 앱을 표시. 고객·관리자 저장소를 초기화하지 않음.</p><label>화면 <select id="route"><option value="together">모임 목록</option><option value="together-find">모임 찾기·모집</option><option value="group-discovery-gwangan-cafe">가입 전 공개 소개</option><option value="group-family-busan">모임 홈</option><option value="activity-family-next">여행 일정</option><option value="activitychat-family-next">일정 채팅</option><option value="together-calendar">전체 캘린더</option><option value="together-tasks">내 할 일</option><option value="together-invites">초대·신청</option><option value="saved">관심 장소</option><option value="home">기존 홈</option><option value="community">기존 여행기</option><option value="places-guide">기존 장소</option><option value="trips">기존 내 여행</option></select></label> <button id="open">화면 열기</button> <button id="measure">배치 확인</button><pre id="results">화면을 고른 뒤 배치 확인.</pre></header><main id="frames"></main><script type="module">
const widths=[320,390,460];
const main=document.querySelector('#frames');
for(const width of widths){const card=document.createElement('section');card.className='frame';card.innerHTML=`<h2>${width}px</h2><iframe title="${width}px 화면" width="${width}" src="/#together"></iframe>`;main.append(card);}
document.querySelector('#open').onclick=()=>{for(const frame of document.querySelectorAll('iframe'))frame.src='/#'+document.querySelector('#route').value;document.querySelector('#results').textContent='불러온 뒤 배치 확인.';};
document.querySelector('#measure').onclick=()=>{const result=[...document.querySelectorAll('iframe')].map(frame=>{const doc=frame.contentDocument;const viewport=Number(frame.width);const shell=doc.querySelector('.app-shell');const visible=[...doc.querySelectorAll('button,input,select,textarea,summary')].filter(el=>el.getBoundingClientRect().width&&el.getBoundingClientRect().height);const overflow=[...doc.querySelectorAll('.tg,.page,.tg-card-copy,.tg-pad,.ic-collections,.browse-switch,.app-header,.tabbar,.tg-composer,.gd,.gd-find-lead,.gd-locations,.gd-categories,.gd-group-card,.chat-expression-picker')].filter(el=>{const r=el.getBoundingClientRect();const intentionalScroll=['auto','scroll'].includes(frame.contentWindow.getComputedStyle(el).overflowX)||el.closest('.gd-home-showcase');return r.width>0&&!intentionalScroll&&(r.right>viewport+1||r.left< -1||el.scrollWidth>el.clientWidth+2);}).map(el=>({element:el.className,width:el.clientWidth,scroll:el.scrollWidth}));const tab=doc.querySelector('.tabbar button span');return {viewport,heading:[...doc.querySelectorAll('h1')].find(el=>el.getBoundingClientRect().width>0)?.textContent,shellWidth:shell?.getBoundingClientRect().width,overflow,tabFont:tab?frame.contentWindow.getComputedStyle(tab).fontSize:null,controls:visible.length,smallTargets:visible.filter(el=>el.getBoundingClientRect().height<36).map(el=>({text:el.textContent.trim().slice(0,35),height:el.getBoundingClientRect().height})),newSmallTargets:visible.filter(el=>el.closest('.gd,.chat-expression-picker,.tg-public-join')&&el.getBoundingClientRect().height<44).map(el=>({text:el.textContent.trim().slice(0,35),height:el.getBoundingClientRect().height})),pendingImages:[...doc.images].filter(img=>img.currentSrc&&!img.complete).length,brokenImages:[...doc.images].filter(img=>img.currentSrc&&img.complete&&!img.naturalWidth).map(img=>img.alt||img.src)};});document.querySelector('#results').textContent=JSON.stringify(result,null,2);};
</script></body></html>
