<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlog · 투표·함께 놀기·챌린지</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeefec;color:#222320;font:14px/1.5 system-ui,sans-serif}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dedfd9;background:white}h1{font-size:18px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}a,select{min-height:44px;padding:10px 12px;border:1px solid #dedfd9;border-radius:10px;background:white;color:inherit;text-decoration:none;font:inherit}main{display:grid;justify-items:center;padding:20px;gap:12px}p{margin:0;color:#64655e}iframe{width:390px;height:min(820px,calc(100dvh - 210px));min-height:440px;border:0;background:#faf9f6;box-shadow:0 4px 24px #0001;border-radius:16px}a[aria-current=page]{background:#222320;color:white}@media(max-width:500px){main{padding:8px}header{padding:12px}}
</style></head><body><header><h1>투표·함께 놀기·챌린지</h1><nav><a href="?screen=groupchat">모임 대화</a><a href="?screen=group">모임 홈</a><a href="?screen=chat">약속 대화</a><a href="?screen=activity">약속·준비</a></nav><label>화면 폭 <select id="width"><option>320</option><option selected>390</option><option>460</option></select></label><label>역할 <select id="role"><option value="owner">모임장</option><option value="member">모임원</option><option value="guest">비로그인</option></select></label></header><main><p>대화 입력창 +에서 투표·놀이·챌린지를 열어보세요. 실제 계정 자료와 분리된 페이지 메모리에서 동작합니다.</p><iframe id="review" title="Spotlog 새 기능" src="about:blank"></iframe></main><script>
const params=new URLSearchParams(location.search);const screen=['groupchat','group','chat','activity'].includes(params.get('screen'))?params.get('screen'):'groupchat';const frame=document.getElementById('review');const width=document.getElementById('width');const role=document.getElementById('role');width.value=['320','390','460'].includes(params.get('width'))?params.get('width'):'390';role.value=['owner','member','guest'].includes(params.get('role'))?params.get('role'):'owner';frame.style.width=width.value+'px';frame.src='platform-review.html?screen='+screen+'&role='+role.value+'&embed=1&tools=1';width.addEventListener('change',()=>{frame.style.width=width.value+'px';const next=new URL(location.href);next.searchParams.set('width',width.value);history.replaceState(null,'',next);syncLinks();});role.addEventListener('change',()=>{const next=new URL(location.href);next.searchParams.set('role',role.value);location.href=next;});function syncLinks(){for(const link of document.querySelectorAll('nav a')){const url=new URL(link.href);url.searchParams.set('width',width.value);url.searchParams.set('role',role.value);link.href=url;if(url.searchParams.get('screen')===screen)link.setAttribute('aria-current','page');}}syncLinks();
</script></body></html>
