<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlog 로컬 4주차·3차 검수</title>
<style>body{margin:0;background:#e9e9e6;font:14px system-ui;color:#222}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:white;position:sticky;top:0;z-index:10}button,select,a{padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:white;color:inherit;text-decoration:none}button[aria-pressed=true]{background:#222;color:white}iframe{display:block;margin:20px auto;border:0;background:white;height:780px;box-shadow:0 8px 24px #0002}output{display:block;margin:12px;white-space:pre-wrap;font-size:13px}h1{font-size:16px;margin:0 10px 0 0}</style>
<header><h1>로컬 화면 검수</h1><button data-width="320">320px</button><button data-width="390" aria-pressed="true">390px</button><button data-width="460">460px</button><label>화면 <select id="route"><option value="home">홈</option><option value="saved">저장</option><option value="trips">내 여행</option><option value="profile">프로필</option><option value="places-photo">장소 사진</option></select></label><button id="measure">화면 크기 검사</button><a href="/#home" target="_blank">제품 화면 열기</a></header>
<output id="result" style="max-height:44px;overflow:auto">독립된 로컬 검수 주소입니다. 공개 사이트에 반영하지 않습니다.</output><iframe id="preview" title="Spotlog 390px 검수" src="/#home" style="width:390px"></iframe>
<script>
const preview=document.getElementById('preview');
for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{preview.style.width=button.dataset.width+'px';preview.title='Spotlog '+button.dataset.width+'px 검수';for(const b of document.querySelectorAll('[data-width]'))b.setAttribute('aria-pressed',String(b===button));});
document.getElementById('route').addEventListener('change',event=>{preview.src='/#'+event.target.value});
document.getElementById('measure').addEventListener('click',()=>{const d=preview.contentDocument,w=preview.contentWindow;const sheet=d.querySelector('.phase-sheet');const field=d.querySelector('.phase-sheet input,.phase-sheet textarea,.phase-sheet select');const rect=sheet?.getBoundingClientRect();document.getElementById('result').textContent=JSON.stringify({width:w.innerWidth,documentWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,sheet:rect?{left:Math.round(rect.left),right:Math.round(rect.right),bottom:Math.round(rect.bottom)}:null,input:field?{size:w.getComputedStyle(field).fontSize,weight:w.getComputedStyle(field).fontWeight}:null},null,2);});
</script></html>
