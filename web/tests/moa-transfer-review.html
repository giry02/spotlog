<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Spotlog MOA 기능 · 메모리 검수</title>
    <style>
      html,body { margin:0; height:100%; }
      body.moa-transfer-review { height:100dvh; overflow:hidden; }
      .moa-transfer-review #root { display:grid; grid-template-rows:auto minmax(0,1fr); min-height:0; height:100%; }
      .moa-transfer-toolbar { box-sizing:border-box; width:100%; max-width:460px; margin:0 auto; padding:0 16px; background:#fff3e7; color:#38322b; border-bottom:1px solid #e5d9cd; font:14px/20px system-ui,sans-serif; }
      .moa-transfer-toolbar summary { display:flex; align-items:center; min-height:44px; font-weight:600; cursor:pointer; }
      .moa-transfer-toolbar[open] { max-height:45dvh; overflow:auto; }
      .moa-transfer-toolbar p { margin:0 0 12px; overflow-wrap:anywhere; }
      .moa-transfer-toolbar small { display:block; margin-bottom:12px; font-size:12px; line-height:16px; }
      .moa-transfer-toolbar nav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
      .moa-transfer-toolbar a,.moa-transfer-toolbar select,.moa-transfer-toolbar button { box-sizing:border-box; min-height:44px; padding:8px 10px; border:1px solid #d6c9bb; border-radius:8px; background:#fff; color:inherit; font:inherit; }
      .moa-transfer-toolbar a { display:inline-flex; align-items:center; text-decoration:none; }
      .moa-transfer-toolbar a[aria-current="page"] { background:#242422; color:#fff; border-color:#242422; }
      .moa-transfer-toolbar label { display:grid; gap:8px; }
      .moa-transfer-app { min-width:0; min-height:0; width:100%; height:100%; }
      .moa-transfer-app .app-shell .content { height:100%; }
      body.moa-transfer-review[data-embed="true"] #root { grid-template-rows:minmax(0,1fr); }
      body.moa-transfer-review[data-embed="true"] .moa-transfer-toolbar { display:none; }
    </style>
  </head>
  <body class="moa-transfer-review">
    <div id="root"><p style="padding:16px">실제 저장소와 분리하는 중…</p></div>
    <script type="module" src="/tests/moa-transfer-review.tsx"></script>
  </body>
</html>
