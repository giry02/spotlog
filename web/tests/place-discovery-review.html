<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>장소 찾기 · 독립 화면 검수</title>
    <style>
      html,body { margin:0; width:100%; height:100%; }
      body.place-discovery-review { height:100dvh; overflow:hidden; }
      .place-discovery-review #root { display:grid; grid-template-rows:auto minmax(0,1fr); height:100%; min-height:0; }
      .place-discovery-review__tools { box-sizing:border-box; width:100%; max-width:460px; margin:0 auto; padding:0 16px; background:#fff3e7; color:#38322b; border-bottom:1px solid #e5d9cd; font:13px/1.5 system-ui,sans-serif; }
      .place-discovery-review__tools > summary { display:flex; align-items:center; min-height:44px; cursor:pointer; font-weight:650; }
      .place-discovery-review__tools[open] { max-height:40dvh; overflow:auto; }
      .place-discovery-review__tools p { margin:0 0 10px; overflow-wrap:anywhere; }
      .place-discovery-review__controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; }
      .place-discovery-review__tools button,.place-discovery-review__tools a { display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; min-height:40px; padding:8px 10px; border:1px solid #d6c9bb; border-radius:8px; color:inherit; background:#fff; font:inherit; text-decoration:none; }
      .place-discovery-review__tools button[aria-pressed=true] { background:#242422; color:#fff; }
      .place-discovery-review__app { min-width:0; min-height:0; height:100%; }
      .place-discovery-review__app .app-shell { height:100%; }
      .place-discovery-review__app .content { height:100%; min-height:0; overflow:auto; }
      .place-discovery-review__app h1 { margin:0 0 16px; font-size:20px; }
      .place-discovery-review__detail { display:grid; gap:12px; min-width:0; }
      .place-discovery-review__detail img { width:100%; max-height:220px; object-fit:cover; border-radius:12px; }
      .place-discovery-review__detail p { margin:0; overflow-wrap:anywhere; line-height:1.6; }
      .place-discovery-review__detail button { min-height:44px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--surface); font:inherit; }
    </style>
  </head>
  <body class="place-discovery-review">
    <div id="root"><p style="padding:16px">실제 저장소와 분리하는 중…</p></div>
    <script type="module" src="/tests/place-discovery-review.tsx"></script>
  </body>
</html>
