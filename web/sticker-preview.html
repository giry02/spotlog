<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

  <body>

        <p class="sticker-size"><strong>160 × 160px</strong><span>스티커 이미지 크기</span></p>
      </header>
      <nav id="sticker-pack-nav" class="sticker-pack-nav" aria-label="스티커 묶음 바로가기" tabindex="-1">
