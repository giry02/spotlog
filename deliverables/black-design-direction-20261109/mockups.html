const section=(title,body,more='더 보기')=>`<section class="section"><div class="section-head"><h3>${title}</h3><button class="more">${more}${i('chevron')}</button></div>${body}</section>`;

const sharedCourse=(photo,title,meta,author)=>`<article class="shared-course"><button class="course-open" data-feedback="코스 상세 → DAY 일정·지도 확인 → 내 여행으로 가져오기 또는 모임에 공유"><img src="${img[photo]}" alt="${title} 여행 사진 예시"><div class="course-copy"><strong>${title}</strong><small>${meta}</small><small>${author}의 공유 코스</small></div></button><button class="course-use" data-feedback="내 여행으로 가져오기 → 날짜·후보·방문 순서 확인 → 내 여행에 저장">${i('copy')}내 여행으로 가져오기</button></article>`;
const home=`${head('<span class="brand">spotlog</span>','전체 지역')}<div class="tabs home-tabs" aria-label="홈 콘텐츠 구분">${['추천','번개·정모','모임','장소 찾기','여행'].map((t,index)=>`<button class="${index===0?'active':''}" data-feedback="상단 ${t} 탭은 유지합니다. 추천은 여러 종류를 함께, 각 탭은 해당 범주의 목록을 보여줍니다.">${t}</button>`).join('')}</div><main class="scroll home-scroll"><div class="search">${i('search')}<span>모임, 장소, 여행 코스를 찾아보세요</span></div>${section('이번 주에 함께해요',`<article class="row date-row"><div class="date">11월<strong>14</strong></div><div class="copy"><strong>커피 한 잔, 해변 한 바퀴</strong><div class="meta">토 14:00 · 민락해변공원</div><div class="meta">7명 참석 · 광안리 커피와 산책</div></div>${i('chevron')}</article>`,'번개·정모')}<div class="divider"></div>${section('함께할 모임을 찾아보세요',row('cafe','광안리 커피와 산책','저장한 카페를 고르고 함께 걸어요','수영구 · 카페·산책 · 12명'),'모임 더 보기')}<div class="divider"></div>${section('가져와 쓰는 여행 코스',`<div class="shared-courses">${sharedCourse('sea','부산, 바다와 커피 하루','당일 · 4곳 · 부산','바다산책')}${sharedCourse('jeju','제주 서쪽을 천천히','1박 2일 · 7곳 · 제주','느린여행')}</div>`,'여행 더 보기')}<div class="divider"></div>${section('여행기로 둘러보는 지역',`<article class="row journal-row"><img class="thumb" src="${img.jeju}" alt="제주 여행기 사진 예시"><div class="copy"><strong>오름을 걷고 차 한 잔, 제주에서</strong><p>직접 다녀온 이야기와 함께한 장소</p><div class="meta">느린여행 · 제주 · 여행기</div></div>${i('chevron')}</article>`,'여행기')}<div class="divider"></div>${section('가보고 싶은 장소',`<div class="place-pair"><button class="place-mini" data-feedback="장소 상세 → 사진·위치·정보 확인 → 저장 또는 내 여행/모임에서 활용"><img src="${img.food}" alt="금수복국 음식점 사진"><span><strong>금수복국</strong><small>부산 · 음식점</small></span></button><button class="place-mini" data-feedback="장소 상세 → 저장 → 개인 여행 후보 또는 모임 공유 장소 선택"><img src="${img.cafe}" alt="비비비당 카페 사진"><span><strong>비비비당</strong><small>부산 · 카페</small></span></button></div>`,'장소 더 보기')}</main>${nav('홈')}`;
const find=`${head('모임')}<div class="tabs"><button class="active">둘러보기</button><button>내 모임</button></div><main class="scroll"><div class="filter-line" style="padding-top:8px"><button class="chosen">아웃도어 · 산책 ${i('down')}</button><button>공원·숲길 ${i('down')}</button><button class="dim">조건 2 ${i('down')}</button></div><div class="results"><div class="section-head"><h3>가까운 산책 모임 <span style="font-size:12px;color:#777;font-weight:400">8</span></h3><button class="more">추천순 ${i('down')}</button></div><p class="plain-note">${i('pin')}부산 수영구 · 선택한 동네 중심</p>${row('sea','광안리 느린 산책','바다 보며 걷고, 커피 한 잔','광안동 · 18명 · 초보 환영','바로 가입')}${row('forest','퇴근길 30분 걷기','평일 저녁에 가볍게 만나요','민락동 · 24명 · 평일 저녁','바로 가입')}${row('cafe','책 한 권, 한 바퀴','책 이야기와 동네 산책을 함께','남천동 · 11명 · 주말 오후','가입 신청')}${row('sea','주말 바다 친구들','부담 없이 걷고 맛있는 한 끼','광안동 · 32명 · 첫 참여 환영','바로 가입')}${row('forest','처음 시작하는 숲길','무리하지 않고 쉬어가는 길','수영동 · 16명 · 초보 환영','가입 신청')}</div><div class="mini-banner">${i('people')}<span><strong>원하는 모임이 없나요?</strong><small>취향과 동네를 정해 직접 시작해요</small></span>${i('chevron')}</div></main>${nav('모임')}`;
const msg=(initial,name,text,c='')=>`<div class="message"><span class="avatar ${c}">${initial}</span><div class="message-content"><div class="name">${name}</div><div class="bubble">${text}</div></div></div>`;
const chat=`<header class="top">${iconBtn('back','모임으로 돌아가기')}<div class="top-title"><strong>광안리 커피와 산책</strong><small>모임 전체 대화 · 12명</small></div>${iconBtn('search','대화 검색')}${iconBtn('more','대화 설정')}</header><div class="notice">${i('bell')}<span>토요일 14시 · 민락해변공원 입구</span>${i('chevron')}</div><div class="ai-tools"><span>안 읽은 대화 38개</span><button>${i('spark')} AI로 정리하기 ${i('chevron')}</button></div><main class="scroll chat-scroll"><p class="chat-date">11월 9일 월요일</p>${msg('지','지훈','14시 괜찮아요. 카페 A, B를 비교해 봐요. 아직 예약은 안 했어요.','b')}${msg('수','수진','유모차가 있어서 계단이 없는 길이면 좋겠어요.','c')}${msg('민','민지 · 모임장','토요일 14시, 민락해변공원 입구로 확정해요. 카페는 아직 후보예요.')}<article class="decision"><div class="decision-head"><span>${i('spark').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:3px"')} 대화 정리</span><small>검토 전</small></div><div class="decision-list"><div class="decision-item"><span class="kind dark">확정</span><p>토요일 14:00 · 민락해변공원<small>모임장이 확정한 시간과 장소</small></p></div><div class="decision-item"><span class="kind">정할 일</span><p>카페 A / B 후보 비교<small>투표·예약 모두 아직 확정 전</small></p></div><div class="decision-item"><span class="kind">확인</span><p>유모차 동선과 카페 좌석<small>현장·업체 확인이 필요해요</small></p></div></div><div class="decision-source"><span>근거 대화 3개 보기</span><span>09:40 정리</span></div><button>내용 확인 후 공지 초안 만들기</button></article><div class="message self"><div class="message-content"><div class="bubble">좋아요. 동선 확인 후 여기에 남길게요.</div><div class="time">09:42</div></div></div></main><div class="composer">${iconBtn('plus','대화 도구')}<div class="input">메시지 입력${i('smile')}</div><button class="send" aria-label="보내기">${i('arrow')}</button></div>`;
const trip=`<header class="top">${iconBtn('back','여행으로 돌아가기')}<div class="top-title"><strong>부산 가족여행</strong><small>우리 가족 · 비공개</small></div>${iconBtn('more','여행 설정')}</header><div class="tabs spread"><button class="active">일정</button><button>대화</button><button>준비</button><button>기록</button></div><main class="scroll"><div class="trip-meta"><span><strong>11.14 토 — 11.15 일</strong><small>1박 2일 · 가족 4명이 함께해요</small></span><div class="members"><span>민</span><span>지</span><span>수</span><span>+1</span></div></div><div class="day-bar"><button class="active">DAY 1</button><button>DAY 2</button><button class="map">${i('map')} 지도</button></div><div class="next"><span><small>오늘의 첫 장소</small><strong>10:30 해운대해수욕장</strong></span><button>길찾기 ${i('arrow').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')}</button></div><div class="timeline">${[['10:30','sea','명소','해운대해수욕장','해운대구 · 바다 산책','해변을 걷고 가족 사진을 남겨요'],['12:00','food','음식점','금수복국 해운대본점','해운대구 · 점심','영업·대기 여부는 방문 전 확인'],['14:00','cafe','카페','비비비당','해운대구 · 차와 휴식','함께 고른 카페 · 예약 미확정'],['16:00','sea','명소','달맞이길 산책','해운대구 · 가벼운 산책','걷는 범위는 함께 정해요']].map(([t,p,k,n,m,d])=>`<article class="visit"><span class="visit-time">${t}</span><img class="thumb" src="${img[p]}" alt="${k} 예시"><div class="copy"><span class="type">${k}</span><strong>${n}</strong><div class="meta">${m}</div><p>${d}</p></div>${i('chevron')}</article>`).join('')}</div><div class="reuse">${i('copy')}<span><strong>이 코스로 다음 여행도</strong><small>개인 일정으로 가져와 자유롭게 수정</small></span>${i('chevron')}</div></main><footer class="trip-foot"><button class="primary">${i('share')} 가족에게 일정 공유</button></footer>`;
const frames=[['home','01 · 함께 보는 추천 홈','기존 상단 탭 유지 · 여행 추천 보강',home],['find','02 · 모임 찾기','선택한 조건은 짧게, 결과는 넓게',find],['chat','03 · 대화와 결정','AI 요약이 다음 행동으로 이어지게',chat],['trip','04 · 함께하는 여행','여행은 DAY와 동선 중심으로',trip]];
document.querySelector('#board').innerHTML=frames.map(([id,title,sub,body])=>`<section class="column" data-view="${id}"><div class="label">${title}<span>${sub}</span></div><div class="phone">${body}<div class="toast" role="status">구성 비교용 예시입니다. 실제 자료는 바뀌지 않습니다.</div></div></section>`).join('');
const view=new URLSearchParams(location.search).get('view');if(frames.some(x=>x[0]===view)){document.body.classList.add('single');document.querySelector(`[data-view="${view}"]`).classList.add('chosen')}
let timeout;document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const t=b.closest('.phone').querySelector('.toast');document.querySelectorAll('.toast').forEach(x=>x.classList.remove('show'));t.textContent=b.dataset.feedback||'구성 비교용 예시입니다. 실제 자료는 바뀌지 않습니다.';t.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>t.classList.remove('show'),2200)}));
</script></html>
